<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Punto Óptimo · Panel</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<style>@media (max-width:900px){#demo-aviso{bottom:auto!important;top:.5rem;left:.5rem;right:.5rem;justify-content:space-between;border-radius:1rem!important}main{padding-top:4.4rem!important}.entrada{padding-top:4.4rem}}</style>
</head>
<body>
<div class="fondo" aria-hidden="true"><span class="mancha"></span><span class="mancha"></span><span class="mancha"></span></div>

<div class="entrada" id="entrada" hidden></div>

<div class="app" id="app" hidden>
  <aside class="lateral">
    <div class="vidrio">
      <div class="marca"><picture><source srcset="logo-blanco.svg" media="(prefers-color-scheme: dark)"><img src="logo-color.svg" alt="Punto Óptimo"></picture></div>
      <nav class="menu" id="menu" aria-label="Secciones">
        <a href="#/inicio" data-v="inicio"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Inicio</a>
        <a href="#/trabajos" data-v="trabajos"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="6" rx="1.5"/></svg>Trabajos</a>
        <a href="#/clientes" data-v="clientes"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.4c2 .7 3.5 2.6 3.5 5.6"/></svg>Clientes</a>
        <a href="#/servicios" data-v="servicios"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Servicios</a>
        <a href="#/cv" data-v="cv"><svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>CV<span class="n" id="n-cv" hidden></span></a>
        <a href="#/instagram" data-v="instagram"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r=".6"/></svg>Instagram</a>
        <a href="#/ajustes" data-v="ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14.2 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2 1.2l.4 2.6h4l.4-2.6a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>Ajustes</a>
      </nav>
      <div class="pie-lateral">
        <div class="usuario-lateral" id="usuario"></div>
        <button class="btn sec chico" id="salir" type="button">Cerrar sesión</button>
      </div>
    </div>
  </aside>
  <main id="vista" tabindex="-1"></main>
</div>
<dialog id="ventana"></dialog>
<div id="aviso" role="status" aria-live="polite"></div>
<div id="demo-aviso" style="position:fixed;right:.8rem;bottom:.8rem;z-index:60;display:flex;gap:.6rem;align-items:center;padding:.45rem .5rem .45rem .9rem;border-radius:999px;background:rgba(4,52,92,.92);color:#fff;font:500 .76rem/1.3 system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.35)">DEMO · datos de ejemplo, guardados solo en tu navegador<button type="button" onclick="if(confirm('¿Volver a los datos de ejemplo originales?')){PuntoOptimoDemo.reiniciar();location.href='./'}" style="border:0;border-radius:999px;padding:.3rem .7rem;background:#59d1c5;color:#032b2b;font:inherit;font-weight:700;cursor:pointer">Restablecer</button></div>
<script src="base.js"></script>
<script src="demo-api.js"></script>
<script src="whatsapp.js"></script>
<script src="vistas/inicio.js"></script>
<script src="vistas/trabajos.js"></script>
<script src="vistas/clientes.js"></script>
<script src="vistas/servicios.js"></script>
<script src="vistas/cv.js"></script>
<script src="vistas/instagram.js"></script>
<script src="vistas/ajustes.js"></script>
<script src="arranque.js"></script>
</body>
</html>
